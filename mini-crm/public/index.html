<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini CRM</title>
  <link rel="stylesheet" href="/estilos.css">
</head>
<body>
  <header>
    <h1>Mini CRM</h1>
    <p id="resumen">Cargando resumen…</p>
  </header>

  <main>
    <section class="panel-lista">
      <div class="acciones" role="toolbar" aria-label="Acciones sobre clientes">
        <button id="btn-crear" type="button" class="btn btn-primario">Nuevo cliente</button>
        <button id="btn-modificar" type="button" class="btn" disabled>Modificar</button>
        <button id="btn-eliminar" type="button" class="btn btn-peligro" disabled>Eliminar</button>
      </div>
      <label for="buscador">Buscar cliente</label>
      <input id="buscador" type="search" autocomplete="off" placeholder="Ej.: Pérez o Café Altura" aria-describedby="ayuda-buscador">
      <p id="ayuda-buscador" class="ayuda">Escribe al menos 2 letras del nombre o de la empresa para filtrar la lista.</p>

      <p id="contador" class="contador" aria-live="polite">Cargando clientes…</p>
      <ul id="clientes" class="lista-clientes"></ul>
    </section>

    <section id="detalle" class="panel-detalle" aria-live="polite">
      <p class="ayuda">Haz clic en un cliente de la lista para ver su detalle.</p>
    </section>
  </main>

  <dialog id="dialogo-cliente">
    <form id="formulario" novalidate>
      <h2 id="titulo-formulario">Nuevo cliente</h2>

      <label>Nombre <input name="nombre" required autocomplete="off"></label>
      <label>Empresa <input name="empresa" autocomplete="off"></label>
      <label>Email <input name="email" type="email" autocomplete="off"></label>
      <label>Teléfono <input name="telefono" autocomplete="off"></label>
      <label>Ciudad <input name="ciudad" autocomplete="off"></label>
      <label>Total de compras (GTQ) <input name="totalCompras" type="number" min="0" step="0.01" value="0"></label>
      <label class="casilla"><input name="activo" type="checkbox" checked> Cliente activo</label>
      <p id="errores-formulario" class="error" role="alert"></p>
      <div class="acciones">
        <button id="btn-cancelar" type="button" class="btn">Cancelar</button>
        <button type="submit" class="btn btn-primario">Guardar</button>
      </div>
    </form>
   
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
